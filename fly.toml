# fly.toml app configuration file generated for djclaude on 2026-05-17T18:04:44-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'djclaude'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  ADDR = ':8080'
  AUTO_ACCEPT = 'true'
  BASE_URL = 'https://dj.aiandsons.io'
  DATABASE_PATH = '/data/karaoke.db'
  PER_SINGER_LIMIT = '2'
  STATIC_DIR = '/app/frontend/dist'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
